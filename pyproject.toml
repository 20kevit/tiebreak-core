[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiebreak-core"
version = "1.2.0"
description = "Standalone FIDE chess tie-break calculation library for individual and team tournaments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "20kevit" }]
keywords = ["chess", "tiebreak", "tie-break", "fide", "tournament", "swiss", "round-robin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/20kevit/tiebreak-core"
Repository = "https://github.com/20kevit/tiebreak-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiebreak_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
